name: Build and push and deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
# A new push to a PR cancels the PR's older run. Runs on master are never cancelled here, since that
# could stop a deploy halfway; the approval jobs below handle master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  maven-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same JDK as the distroless runtime image (Temurin). check-latest skips the runner's
      # cached JDK, which can lag behind.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          check-latest: true
          cache: 'maven'
      - run: mvn verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/*.jar
  docker-smoke:
    needs: [maven-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact
          path: target
      - run: docker build -t ukur:smoke .
      # Nothing else in CI runs the image. Reaching Spring's startup line proves the JRE loaded the
      # application bytecode; it then fails on config that only exists in the cluster, which is fine.
      # A wrong class file version or an unusable base image never gets that far.
      - run: |
          timeout 180 docker run --rm ukur:smoke 2>&1 | tee smoke.log || true
          grep -q "using Java" smoke.log
  docker-lint:
    needs: [ maven-verify ]
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
  docker-build:
    needs: [maven-verify, docker-lint]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    needs: [docker-build, docker-smoke]
    uses: entur/gha-docker/.github/workflows/push.yml@v1
  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@v2
    with:
      environment: dev

  terraform-lint:
    uses: entur/gha-terraform/.github/workflows/lint.yml@v3


  tf-plan-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, docker-push ]
    name: Terraform Plan DEV
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: dev

  tf-approval-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve DEV tf plan"

  tf-apply-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev, tf-approval-dev ]
    name: Terraform Apply DEV
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: dev
      has_changes: ${{ needs.tf-plan-dev.outputs.has_changes }}

  deploy-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ helm-lint, tf-plan-dev, tf-apply-dev, docker-push, docker-lint ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/ukur
      image_set_path: "image.identifier"
      namespace: ukur
      release_name: ukur
    secrets: inherit

  approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ deploy-dev, helm-lint, tf-plan-dev, tf-apply-dev, docker-push, docker-lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    # A newer run reaching this approval cancels the older run's pending one. One group per stage,
    # so an older run reaching prd approval cannot cancel a newer run's tst approval.
    concurrency:
      group: ${{ github.workflow }}-approval-tst
      cancel-in-progress: true
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"


  tf-plan-tst:
    # A cancelled approval is not a failure, so everything after an approval requires success explicitly.
    # PRs skip the approvals but still plan.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'pull_request' || needs.approval-tst.result == 'success') }}
    needs: [ terraform-lint, approval-tst ]
    name: Terraform Plan TST
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: tst

  tf-approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST tf plan"

  tf-apply-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst, tf-approval-tst ]
    name: Terraform Apply TST
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: tst
      has_changes: ${{ needs.tf-plan-tst.outputs.has_changes }}


  deploy-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' && needs.approval-tst.result == 'success' }}
    needs: [ approval-tst, tf-plan-tst, tf-apply-tst, docker-push, docker-lint ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/ukur
      image_set_path: "image.identifier"
      namespace: ukur
      release_name: ukur
    secrets: inherit

  approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' && needs.deploy-tst.result == 'success' }}
    needs: [ deploy-tst, approval-tst, tf-plan-tst, tf-apply-tst, docker-push, docker-lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    concurrency:
      group: ${{ github.workflow }}-approval-prd
      cancel-in-progress: true
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"


  tf-plan-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'pull_request' || needs.approval-prd.result == 'success') }}
    needs: [ terraform-lint, approval-prd ]
    name: Terraform Plan PRD
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: prd

  tf-approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD tf plan"

  tf-apply-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd, tf-approval-prd ]
    name: Terraform Apply PRD
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: prd
      has_changes: ${{ needs.tf-plan-prd.outputs.has_changes }}


  deploy-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' && needs.approval-prd.result == 'success' }}
    needs: [ approval-prd, tf-plan-prd, tf-apply-prd, docker-push, docker-lint ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/ukur
      image_set_path: "image.identifier"
      namespace: ukur
      release_name: ukur
    secrets: inherit