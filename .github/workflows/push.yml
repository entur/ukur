name: Build and push and deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  maven-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # semver as the vulnerable 21.0.13.0.2 GA build), so install the exact JDK from its tarball.
      - name: Download Liberica JDK 21.0.13.0.3+5
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/liberica.tar.gz" "https://github.com/bell-sw/Liberica/releases/download/21.0.13.0.3+5/bellsoft-jdk21.0.13.0.3+5-linux-amd64.tar.gz"
          echo "f6bac5c836223d91525360bfbb2e422b39f8fcebedafbc1adda27945934926da  $RUNNER_TEMP/liberica.tar.gz" | sha256sum -c -
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/liberica.tar.gz
          java-version: 21.0.13
          cache: 'maven'
      - run: mvn verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/*.jar
  docker-lint:
    needs: [ maven-verify ]
    uses: entur/gha-docker/.github/workflows/lint.yml@a1d476b895a271d0fe8557f1b763529b64fb0554 # v1.14.0
    with:
      ignore: "DL3018"
  docker-build:
    needs: [maven-verify, docker-lint]
    uses: entur/gha-docker/.github/workflows/build.yml@a1d476b895a271d0fe8557f1b763529b64fb0554 # v1.14.0
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    needs: [docker-build]
    uses: entur/gha-docker/.github/workflows/push.yml@a1d476b895a271d0fe8557f1b763529b64fb0554 # v1.14.0
  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@bd1e0a9b022ee0fafe43723b7c80c0eb48171593 # v1.7.0
    with:
      environment: dev

  terraform-lint:
    uses: entur/gha-terraform/.github/workflows/lint.yml@7492b8dd422a63a6826f1ccfbdec14c7e5d43bb0 # v2.5.0


  tf-plan-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, docker-push ]
    name: Terraform Plan DEV
    uses: entur/gha-terraform/.github/workflows/plan.yml@7492b8dd422a63a6826f1ccfbdec14c7e5d43bb0 # v2.5.0
    with:
      environment: dev

  tf-approval-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve DEV tf plan"

  tf-apply-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev, tf-approval-dev ]
    name: Terraform Apply DEV
    uses: entur/gha-terraform/.github/workflows/apply.yml@7492b8dd422a63a6826f1ccfbdec14c7e5d43bb0 # v2.5.0
    with:
      environment: dev
      has_changes: ${{ needs.tf-plan-dev.outputs.has_changes }}

  deploy-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ helm-lint, tf-plan-dev, tf-apply-dev, docker-push, docker-lint ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@bd1e0a9b022ee0fafe43723b7c80c0eb48171593 # v1.7.0
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/ukur
      image_set_path: "image.identifier"
      namespace: ukur
      release_name: ukur
    secrets: inherit

  approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ deploy-dev, helm-lint, tf-plan-dev, tf-apply-dev, docker-push, docker-lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"


  tf-plan-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-tst ]
    name: Terraform Plan TST
    uses: entur/gha-terraform/.github/workflows/plan.yml@7492b8dd422a63a6826f1ccfbdec14c7e5d43bb0 # v2.5.0
    with:
      environment: tst

  tf-approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST tf plan"

  tf-apply-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst, tf-approval-tst ]
    name: Terraform Apply TST
    uses: entur/gha-terraform/.github/workflows/apply.yml@7492b8dd422a63a6826f1ccfbdec14c7e5d43bb0 # v2.5.0
    with:
      environment: tst
      has_changes: ${{ needs.tf-plan-tst.outputs.has_changes }}


  deploy-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ approval-tst, tf-plan-tst, tf-apply-tst, docker-push, docker-lint ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@bd1e0a9b022ee0fafe43723b7c80c0eb48171593 # v1.7.0
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/ukur
      image_set_path: "image.identifier"
      namespace: ukur
      release_name: ukur
    secrets: inherit

  approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ deploy-tst, approval-tst, tf-plan-tst, tf-apply-tst, docker-push, docker-lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"


  tf-plan-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-prd ]
    name: Terraform Plan PRD
    uses: entur/gha-terraform/.github/workflows/plan.yml@7492b8dd422a63a6826f1ccfbdec14c7e5d43bb0 # v2.5.0
    with:
      environment: prd

  tf-approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD tf plan"

  tf-apply-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd, tf-approval-prd ]
    name: Terraform Apply PRD
    uses: entur/gha-terraform/.github/workflows/apply.yml@7492b8dd422a63a6826f1ccfbdec14c7e5d43bb0 # v2.5.0
    with:
      environment: prd
      has_changes: ${{ needs.tf-plan-prd.outputs.has_changes }}


  deploy-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ approval-prd, tf-plan-prd, tf-apply-prd, docker-push, docker-lint ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@bd1e0a9b022ee0fafe43723b7c80c0eb48171593 # v1.7.0
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/ukur
      image_set_path: "image.identifier"
      namespace: ukur
      release_name: ukur
    secrets: inherit